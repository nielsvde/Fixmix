<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Correctie Calculator</title>
    <style>
        :root {
            --primary: #005A9C;
            --primary-hover: #004070;
            --bg: #F4F7F9;
            --card-bg: #FFFFFF;
            --text: #333333;
            --border: #CCCCCC;
            --accent-plus: #d9534f;
            --accent-minus: #0275d8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }

        .container {
            max-width: 650px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        h1 {
            font-size: 1.4rem;
            color: var(--primary);
            margin-top: 0;
            margin-bottom: 15px;
            text-align: center;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 8px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 0.95rem;
        }

        input[type="number"], select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
        }

        .row {
            display: flex;
            gap: 10px;
        }

        .col {
            flex: 1;
        }

        button {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .result-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #EBF3FA;
            border-left: 5px solid var(--primary);
            border-radius: 6px;
        }

        .result-title {
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 10px;
            color: var(--primary);
        }

        .bold-action {
            font-weight: 800;
            text-transform: uppercase;
        }

        .badge-sign {
            display: inline-block;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 4px;
            color: #fff;
            margin-right: 4px;
        }

        .sign-plus {
            background-color: var(--accent-plus);
        }

        .sign-minus {
            background-color: var(--accent-minus);
        }

        .tooltip-icon {
            display: inline-block;
            width: 18px;
            height: 18px;
            background-color: #6c757d;
            color: white;
            border-radius: 50%;
            text-align: center;
            line-height: 18px;
            font-size: 0.75rem;
            font-weight: bold;
            cursor: pointer;
            margin-left: 4px;
            position: relative;
        }

        .tooltip-icon:hover::after, .tooltip-icon:focus::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: 125%;
            left: 50%;
            transform: translateX(-50%);
            background-color: #333;
            color: #fff;
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            white-space: nowrap;
            z-index: 10;
            font-weight: normal;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .sub-fields {
            margin-top: 10px;
            padding: 10px;
            background-color: #f8f9fa;
            border: 1px dashed var(--border);
            border-radius: 6px;
            display: none;
        }

        .sub-fields.active {
            display: block;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Product Correctie Calculator</h1>

    <div class="form-group">
        <label for="batchSize">Huidige inhoud mixtank (kg):</label>
        <input type="number" id="batchSize" value="10000" placeholder="bijv. 10000">
    </div>

    <div class="row">
        <div class="col form-group">
            <label for="currentFat">Gemeten vet (%):</label>
            <input type="number" id="currentFat" step="0.01" value="40.50" placeholder="bijv. 40.5">
        </div>
        <div class="col form-group">
            <label for="targetFat">Doel vet (%):</label>
            <input type="number" id="targetFat" step="0.01" value="40.00" placeholder="bijv. 40.0">
        </div>
    </div>

    <div class="form-group">
        <label for="roomVet">Vetgehalte beschikbare room (%):</label>
        <input type="number" id="roomVet" step="0.01" value="40.00" placeholder="bijv. 40.0">
    </div>

    <div class="form-group">
        <label for="oorzaak">Oorzaak afwijking:</label>
        <select id="oorzaak" onchange="toggleOorzaakFields()">
            <option value="geen">-- Selecteer oorzaak --</option>
            <option value="onbekend">Oorzaak onbekend</option>
            <option value="ontbrekende_room">Ontbrekende Room herverwerking</option>
            <option value="verkeerd_gedoseerd">Verkeerd gedoseerd ingrediënt</option>
        </select>
    </div>

    <!-- Invulvelden voor Ontbrekende Room herverwerking -->
    <div id="herverwerkingFields" class="sub-fields">
        <div class="form-group">
            <label for="herverwerkingHoeveelheid">Hoeveelheid ontbrekende herverwerking (kg):</label>
            <input type="number" id="herverwerkingHoeveelheid" placeholder="bijv. 250">
        </div>
        <div class="form-group">
            <label for="herverwerkingVet">Vetgehalte van de herverwerking (%):</label>
            <input type="number" id="herverwerkingVet" step="0.01" placeholder="bijv. 35.00">
        </div>
    </div>

    <button onclick="berekenCorrectie()">Bereken Correctie</button>

    <div id="resultaatBox" class="result-box" style="display:none;">
        <div class="result-title">Advies & Correctie</div>
        <div id="resultaatInhoud"></div>
    </div>
</div>

<script>
    function toggleOorzaakFields() {
        const oorzaak = document.getElementById('oorzaak').value;
        const subFields = document.getElementById('herverwerkingFields');
        if (oorzaak === 'ontbrekende_room') {
            subFields.classList.add('active');
        } else {
            subFields.classList.remove('active');
        }
    }

    function berekenCorrectie() {
        const batch = parseFloat(document.getElementById('batchSize').value) || 0;
        const currentFat = parseFloat(document.getElementById('currentFat').value) || 0;
        const targetFat = parseFloat(document.getElementById('targetFat').value) || 0;
        const roomVet = parseFloat(document.getElementById('roomVet').value) || 0;

        const deltaFatPct = currentFat - targetFat;
        const currentFatKg = batch * (currentFat / 100);
        const targetFatKg = batch * (targetFat / 100);
        const fatDifferenceKg = currentFatKg - targetFatKg;

        let resultHtml = "";

        // Vet afwijking aanduiding (+ / - met vraagteken tooltip)
        if (fatDifferenceKg > 0) {
            resultHtml += `<p><strong>Vet afwijking:</strong> <span class="badge-sign sign-plus">+</span> +${Math.abs(fatDifferenceKg).toFixed(2)} kg vet 
            <span class="tooltip-icon" data-tooltip="+ : Te veel vet in de batch">?</span></p>`;
        } else if (fatDifferenceKg < 0) {
            resultHtml += `<p><strong>Vet afwijking:</strong> <span class="badge-sign sign-minus">-</span> -${Math.abs(fatDifferenceKg).toFixed(2)} kg vet 
            <span class="tooltip-icon" data-tooltip="- : Te weinig vet in de batch">?</span></p>`;
        } else {
            resultHtml += `<p><strong>Vet afwijking:</strong> Correct (0 kg)</p>`;
        }

        // Bepaling actie met dikgedrukt TOEVOEGEN of INHOUDEN
        if (deltaFatPct > 0) {
            const toevoegenKg = (fatDifferenceKg / (targetFat / 100));
            resultHtml += `<p>Om het doelvetgehalte van ${targetFat}% te bereiken:</p>`;
            resultHtml += `<ul>`;
            resultHtml += `<li><span class="bold-action">TOEVOEGEN</span>: ${toevoegenKg.toFixed(1)} kg magere melk / verdunningsvloeistof.</li>`;
            resultHtml += `<li>Of bij de volgende dosering: <span class="bold-action">INHOUDEN</span> van extra vet/room.</li>`;
            resultHtml += `</ul>`;
        } else if (deltaFatPct < 0) {
            const benodigdeRoomKg = (Math.abs(fatDifferenceKg) / ((roomVet - targetFat) / 100));
            resultHtml += `<p>Om het doelvetgehalte van ${targetFat}% te bereiken:</p>`;
            resultHtml += `<ul>`;
            resultHtml += `<li><span class="bold-action">TOEVOEGEN</span>: ${benodigdeRoomKg.toFixed(1)} kg room (${roomVet}% vet).</li>`;
            resultHtml += `</ul>`;
        } else {
            resultHtml += `<p>Geen vetcorrectie nodig. Het vetgehalte is exact op doel.</p>`;
        }

        // Extra info bij gekozen oorzaak
        const oorzaak = document.getElementById('oorzaak').value;
        if (oorzaak === 'ontbrekende_room') {
            const hwHoeveelheid = parseFloat(document.getElementById('herverwerkingHoeveelheid').value) || 0;
            const hwVet = parseFloat(document.getElementById('herverwerkingVet').value) || 0;
            const hwVetKg = hwHoeveelheid * (hwVet / 100);
            resultHtml += `<hr style="border:0; border-top:1px solid #ccc; margin:10px 0;">`;
            resultHtml += `<p><strong>Oorzaak analyse:</strong> Ontbrekende Room Herverwerking (${hwHoeveelheid} kg @ ${hwVet}% vet = ${hwVetKg.toFixed(2)} kg vet).</p>`;
        } else if (oorzaak === 'onbekend') {
            resultHtml += `<hr style="border:0; border-top:1px solid #ccc; margin:10px 0;">`;
            resultHtml += `<p><strong>Oorzaak analyse:</strong> Oorzaak onbekend. Controleer de dosering en de monstername.</p>`;
        }

        document.getElementById('resultaatInhoud').innerHTML = resultHtml;
        document.getElementById('resultaatBox').style.display = 'block';
    }
</script>

</body>
</html>
